# XcodeGen spec — the .xcodeproj is generated, not committed, so there's no
# pbxproj to merge-conflict over. Regenerate after adding files:
#
#   cd apps/ios && xcodegen generate
#
# See README.md for signing + install.

name: Hermit
options:
  bundleIdPrefix: ai.swaylab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is left to Xcode's automatic mode with the developer's own team,
    # which is why DEVELOPMENT_TEAM is not pinned here (it would break every
    # other checkout). Set it once in Xcode, or via a local xcconfig.
    CODE_SIGN_STYLE: Automatic

targets:
  Hermit:
    type: application
    platform: iOS
    sources:
      - path: Hermit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.swaylab.hermit
        INFOPLIST_FILE: Hermit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Hermit/Hermit.entitlements
      properties:
        # Xcode rewrites this to `production` for a distribution build; the app
        # reads the REAL value back out of its embedded provisioning profile at
        # runtime (ProvisioningProfile.swift) rather than trusting a #if DEBUG.
        aps-environment: development
    scheme:
      testTargets:
        - HermitTests
        - HermitUITests

  # Plain unit tests. Only for logic that can be wrong in a way a screenshot would
  # not show — right now that is AppConfig.isInternal, which decides whether a URL
  # stays inside the app or is handed to Safari.
  HermitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermitTests
    dependencies:
      - target: Hermit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.swaylab.hermit.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hermit.app/Hermit"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  # One end-to-end launch on a simulated phone. See HermitUITests/SmokeTests.swift
  # and smoke.sh — for a shell whose whole job is "load the web app", this is worth
  # more than unit tests around the seams.
  HermitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HermitUITests
    dependencies:
      - target: Hermit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.swaylab.hermit.uitests
        TEST_TARGET_NAME: Hermit
        GENERATE_INFOPLIST_FILE: YES
